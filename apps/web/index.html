    <title>OmniCloud — Self-hosted cloud storage for your Telegram</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "OmniCloud",
            "url": "https://omnicloud-chi.vercel.app/",
            "description": "Self-hosted cloud storage powered by your Telegram account.",
            "inLanguage": ["en", "ar", "ru"],
            "publisher": { "@id": "https://omnicloud-chi.vercel.app/#org" }
          },
          {
            "@type": "Organization",
            "@id": "https://omnicloud-chi.vercel.app/#org",
            "name": "Hilbras",
            "url": "https://github.com/Hilbras",
            "logo": "https://omnicloud-chi.vercel.app/brand/logo-512.png"
          },
          {
            "@type": "SoftwareApplication",
            "name": "OmniCloud",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Web, Node.js",
            "description": "Self-hosted cloud storage powered by your Telegram account. Folders, search, versions, trash, and opt-in client-side encryption.",
            "url": "https://omnicloud-chi.vercel.app/",
            "author": { "@id": "https://omnicloud-chi.vercel.app/#org" },

    <script>
      // Apply the theme before first paint (no flash).
      (function () {
        try {
          var stored = localStorage.getItem("omnicloud-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* First-visit splash — self-contained so it paints before any app CSS loads. */
      :root:not([data-theme="dark"]) {
        --splash-bg: #faf9f5;
        --splash-muted: #6f6857;
        --splash-line: #e7e1d1;
      }
      :root[data-theme="dark"] {
        --splash-bg: #0c0b09;
        --splash-muted: #9c9584;
        --splash-line: #262117;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        transition: opacity 450ms ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .no-splash #splash {
        display: none;
      }
      .splash-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .splash-mark {
        position: relative;
        width: 48px;
        height: 48px;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      .splash-mark img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .splash-mark .brand-mark-dark {
        display: block;
      }
      .splash-mark .brand-mark-light {
        display: none;
      }
      :root[data-theme="light"] .splash-mark .brand-mark-dark {
        display: none;
      }
      :root[data-theme="light"] .splash-mark .brand-mark-light {
        display: block;
      }
      .splash-name {
        font:
          600 13px/1 "Geist",
          system-ui,
          sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--splash-muted);
        animation: splash-fade 0.7s ease both;
      }
      .splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: var(--splash-line);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #d4af37, #f3d789);
        animation: splash-sweep 0.9s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.75;
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-name,
        .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-col">
        <span class="splash-mark" aria-hidden="true">
          <img class="brand-mark-dark" src="/brand/logo-mark.svg" alt="" />
          <img class="brand-mark-light" src="/brand/logo-mark-light.svg" alt="" />
        </span>
        <span class="splash-name">OmniCloud</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Splash controller: first visit per session plays the splash,
      // later visits (and navigations) skip it.
      (function () {
        var el = document.getElementById("splash");
        if (!el) return;
        var seen = false;
        try {
          seen = sessionStorage.getItem("omnicloud-splash") === "1";
        } catch (e) {}
        if (seen) {
          document.documentElement.classList.add("no-splash");
          el.remove();
          return;
        }
        try {
          sessionStorage.setItem("omnicloud-splash", "1");
        } catch (e) {}
        setTimeout(function () {
          el.classList.add("is-done");
          setTimeout(function () {
            if (el.parentNode) el.remove();
          }, 550);
        }, 650);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
