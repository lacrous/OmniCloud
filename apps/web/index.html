<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="OmniCloud — self-hosted cloud storage powered by your Telegram account."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0b09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>OmniCloud</title>
    <script>
      // Apply the theme before first paint (no flash).
      (function () {
        try {
          var stored = localStorage.getItem("omnicloud-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* First-visit splash — self-contained so it paints before any app CSS loads. */
      :root:not([data-theme="dark"]) {
        --splash-bg: #faf9f5;
        --splash-muted: #6f6857;
        --splash-line: #e7e1d1;
      }
      :root[data-theme="dark"] {
        --splash-bg: #0c0b09;
        --splash-muted: #9c9584;
        --splash-line: #262117;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        transition: opacity 450ms ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .no-splash #splash {
        display: none;
      }
      .splash-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .splash-mark {
        color: var(--gold-mark, #d4af37);
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      :root[data-theme="dark"] .splash-mark {
        --gold-mark: #e2bd52;
      }
      .splash-name {
        font:
          600 13px/1 "Geist",
          system-ui,
          sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--splash-muted);
        animation: splash-fade 0.7s ease both;
      }
      .splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 999px;
        background: var(--splash-line);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--gold-mark, #d4af37), #f3d789);
        animation: splash-sweep 0.9s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.75;
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-name,
        .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-col">
        <svg class="splash-mark" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="splash-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e9c963" />
              <stop offset="0.55" stop-color="#d4af37" />
              <stop offset="1" stop-color="#a8801a" />
            </linearGradient>
          </defs>
          <path
            fill="url(#splash-gold)"
            d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"
          />
        </svg>
        <span class="splash-name">OmniCloud</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Splash controller: first visit per session plays the splash,
      // later visits (and navigations) skip it.
      (function () {
        var el = document.getElementById("splash");
        if (!el) return;
        var seen = false;
        try {
          seen = sessionStorage.getItem("omnicloud-splash") === "1";
        } catch (e) {}
        if (seen) {
          document.documentElement.classList.add("no-splash");
          el.remove();
          return;
        }
        try {
          sessionStorage.setItem("omnicloud-splash", "1");
        } catch (e) {}
        setTimeout(function () {
          el.classList.add("is-done");
          setTimeout(function () {
            if (el.parentNode) el.remove();
          }, 550);
        }, 650);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
