name: Release

on:
  push:
    tags:
      - "v*"
  # Some organisations disable tag-triggered workflows, so a release can also
  # be dispatched by hand. The dispatched version must still match every
  # manifest, and the tag it releases must already exist — the dispatch is a
  # different way to start the same release, not a way around the checks.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0. Must match every package manifest."
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Verify, build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify every version matches the tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="$RELEASE_VERSION"
          SDK_VERSION="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$TAG" != "$SDK_VERSION" ]; then
            echo "::error::Tag v$TAG does not match @hilbras/omnicloud version $SDK_VERSION"
            exit 1
          fi
          # The API reports the version it was built with, and reads it from the
          # package manifest next to it. Check it the same way the code does,
          # rather than grepping a source constant that is no longer inline.
          API_VERSION="$(node -e "
            const {readFileSync} = require('node:fs');
            const {join, resolve} = require('node:path');
            const here = resolve('apps/api/src');
            const manifest = JSON.parse(readFileSync(resolve(join(here, '..', 'package.json')), 'utf8'));
            process.stdout.write(manifest.version);
          ")"
          if [ "$API_VERSION" != "$SDK_VERSION" ]; then
            echo "::error::the API reports version $API_VERSION but the tag is v$TAG"
            exit 1
          fi
          for manifest in package.json apps/api/package.json apps/web/package.json \
                          packages/core/package.json packages/database/package.json \
                          packages/shared/package.json packages/telegram/package.json \
                          packages/crypto/package.json; do
            V="$(node -p "require('./$manifest').version")"
            if [ "$V" != "$SDK_VERSION" ]; then
              echo "::error::$manifest is $V but the tag is v$TAG"
              exit 1
            fi
          done
          echo "Releasing @hilbras/omnicloud@$SDK_VERSION";

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build before test, as the CI workflow does: the SDK declarations test
      # and the web bundle checks need build output, and a skipped check is not
      # a passing one.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify the published bundle imports in Node (ESM + CJS)
        run: |
          node --input-type=module -e "
            const m = await import('./packages/sdk/dist/index.js');
            if (typeof m.OmniCloudClient !== 'function') throw new Error('ESM: OmniCloudClient missing');
            console.log('ESM bundle OK');
          "
          node -e "
            const m = require('./packages/sdk/dist/index.cjs');
            if (typeof m.OmniCloudClient !== 'function') throw new Error('CJS: OmniCloudClient missing');
            console.log('CJS bundle OK');
          "

      - name: Verify the packed tarball installs and runs from a clean project
        run: |
          set -euo pipefail
          OUT="$(mktemp -d)"
          (cd packages/sdk && npm pack --pack-destination "$OUT")
          TGZ="$(ls "$OUT"/*.tgz)"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y > /dev/null
          npm install "$TGZ"
          ./node_modules/.bin/omnicloud version
          node --input-type=module -e "const m = await import('@hilbras/omnicloud'); if (typeof m.OmniCloudClient !== 'function') throw new Error('ESM import failed'); console.log('ESM import OK')"
          node -e "const m = require('@hilbras/omnicloud'); if (typeof m.OmniCloudClient !== 'function') throw new Error('CJS require failed'); console.log('CJS require OK')"
          test -f node_modules/@hilbras/omnicloud/server/index.js

      - name: Publish @hilbras/omnicloud
        run: pnpm --filter @hilbras/omnicloud publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/Hilbras/OmniCloud/blob/main/CHANGELOG.md) for details.

            **Package:** [`@hilbras/omnicloud@${{ steps.version.outputs.version }}`](https://www.npmjs.com/package/@hilbras/omnicloud)
