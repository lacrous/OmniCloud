services:
  postgres:
    image: postgres:16-alpine
    container_name: omnicloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnicloud
      POSTGRES_PASSWORD: omnicloud
      POSTGRES_DB: omnicloud
    ports:
      - "5432:5432"
    volumes:
      - omnicloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicloud -d omnicloud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omnicloud-postgres-data:
